[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "apple410"
version = "0.1.0"
description = "A library for controlling the Apple 410 Color Plotter"
requires_python = ">=3"
authors = [
    { name = "Adam Mayer", email = "phooky@gmail.com" },
]
license = "MIT"
license-files = [ "LICENSE" ]
dependencies = [ "pyserial" ]
keywords = "plotter apple410 retrocomputing"
classifiers=[
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Topic :: Printing',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.3',
    'Programming Language :: Python :: 3.4',
    'Programming Language :: Python :: 3.5',
]

[project.scripts]
apple410 = "apple410.cmdline:main"
a410svg2plot = "apple410.cmdline:svg2plot"
a410plot2svg = "apple410.cmdline:plot2svg"
a410plot2png = "apple410.cmdline:plot2png"


[project.urls]
Homepage = "https://github.com/nycresistor/Apple410"
Issues = "https://github.com/nycresistor/Apple410/issues"
